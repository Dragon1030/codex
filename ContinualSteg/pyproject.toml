[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-steg"
version = "0.1.0"
description = "Continual robust image information hiding with task adapters"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["continual_steg*"]
